name = "agrivision-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# Non-secret environment. Social login: GOOGLE_CLIENT_ID pins the accepted `aud` on Google
# id_tokens at /api/auth/google/login (must match GOOGLE_CLIENT_ID in js/config.js).
[vars]
# ALLOWED_ORIGIN = "https://agrivision.example.com"   # default "*"
GOOGLE_CLIENT_ID = "634422093981-od2rmhdjqaiof1uhb3glj6oi0e6lrkcu.apps.googleusercontent.com"
FACEBOOK_APP_ID = "26899197766369996"   # must match FACEBOOK_APP_ID in js/config.js

# Facebook login secret (OUR app secret — not a user secret, so allowed under CLAUDE.md):
#   wrangler secret put FACEBOOK_APP_SECRET
# Required together with FACEBOOK_APP_ID for /api/auth/facebook/login; without it the
# endpoint returns 503. From https://developers.facebook.com/apps → Settings → Basic.

# Copernicus Data Space (Sentinel-2 satellite imagery). Register a free OAuth client at
# https://shapps.dataspace.copernicus.eu/dashboard/ (User settings → OAuth clients):
#   wrangler secret put CDSE_CLIENT_ID
#   wrangler secret put CDSE_CLIENT_SECRET
# Without them /api/satellite/* returns 503. For local dev, add both to worker/.dev.vars.
# Optional [vars] CDSE_BASE to use a commercial Sentinel Hub account instead of CDSE.

# Météo-France (weather: rainfall, AROME-OI). OAuth2 client-credentials — the value is the
# Basic-auth string base64(consumerKey:consumerSecret) from the portal token page:
#   wrangler secret put METEOFRANCE_APPLICATION_ID
# For local dev, add it to worker/.dev.vars. The Worker exchanges it for a ~1h bearer token
# (cached). Manage the app / keys / subscriptions (DPObs, Vigilance, Paquets Modèles) here:
#   https://portail-api.meteofrance.fr/web/fr/dashboard

# AgriVision session JWT secret. Used to sign HS256 session tokens minted at
# /api/auth/dropbox/login. Generate with: openssl rand -hex 32
# Then: wrangler secret put AGRI_JWT_SECRET
# Without it, the /api/auth/* and identified endpoints return 503.

# Mistral AI (second provider, optional):
#   wrangler secret put MISTRAL_API_KEY
# Get a key from https://console.mistral.ai/api-keys/. Without this, /api/mistral
# returns 503; existing Anthropic routes continue to work unchanged.

# Stripe secrets:
#   wrangler secret put STRIPE_SECRET_KEY     # sk_test_… (test) or sk_live_… (prod)
#   wrangler secret put STRIPE_WEBHOOK_SECRET # whsec_… from Stripe → Webhooks → endpoint
# The webhook secret is set AFTER you create the webhook endpoint in Stripe
# (Dashboard → Developers → Webhooks → + Add endpoint, pointing at
# https://<your-worker>.workers.dev/api/billing/webhook with these events:
# customer.subscription.created/updated/deleted, invoice.payment_failed).

# KV namespace for "Share with AgriVision" + storage pointers + backup restore + the
# email-anchor account index. Production namespace created via `wrangler kv namespace create
# SHARE_KV`. For `wrangler dev --remote`, also create a preview namespace and add its id as
# `preview_id` below: `wrangler kv namespace create SHARE_KV --preview`.
[[kv_namespaces]]
binding = "SHARE_KV"
id = "077d043f23b44441adc8b7417f862e9e"

# Rain alerts (Web Push). VAPID private key (P-256 scalar, base64url) — pairs with the public
# key in js/config.js + worker.js VAPID_PUBLIC_KEY. Regenerate the pair to rotate.
#   wrangler secret put VAPID_PRIVATE_KEY
# For local dev add it to worker/.dev.vars. Without it, /api/alerts/* returns 503.
# The cron below polls forecasts every 6h and pushes when rain ≥ threshold is coming
# (only runs on the DEPLOYED Worker, not in `wrangler dev`).
[triggers]
crons = ["0 */6 * * *"]
